[workspace]
members = ["game", "collectibles", "market", "rewards", "vault", "vault-factory", "tasks", "creators", "npc-games", "badges", "yield-vault", "ledger", "soulbound-ft", "qgold"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
