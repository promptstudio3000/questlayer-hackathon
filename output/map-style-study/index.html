<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuestLayer — skutečná mapa a herní styl</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#edf2e8;color:#28243b}#map{position:absolute;inset:0}header{position:absolute;z-index:2;top:16px;left:16px;right:16px;background:#fffffff2;border:1px solid #e5e1ef;border-radius:18px;padding:14px 18px;display:flex;gap:20px;align-items:center;box-shadow:0 6px 24px #34245112}strong{font-size:18px;letter-spacing:.03em}header span{color:#72677e;font-size:13px}nav{display:flex;gap:6px;margin-left:auto}button{border:1px solid #ded8e7;border-radius:10px;background:white;color:#40354f;padding:10px 14px;font:600 13px system-ui;cursor:pointer}button[aria-pressed=true]{background:#7450bc;color:white;border-color:#7450bc}.note{position:absolute;left:18px;bottom:42px;z-index:2;background:#fffffff2;padding:12px 16px;border-radius:12px;max-width:330px;font-size:13px;line-height:1.5;box-shadow:0 4px 20px #34245112}.note b{display:block}.status{font-size:12px;color:#695f73}.maplibregl-ctrl-top-right{top:95px}.pin{font-size:26px;text-shadow:0 2px 4px #fff}.coin{width:22px;height:25px;background:#ffd44b;border:4px solid #b77d24;box-shadow:inset 3px 0 #fff09d;border-radius:5px}.chest{width:26px;height:23px;background:#b55839;border:3px solid #53375c;border-radius:4px;position:relative}.chest:after{content:"";position:absolute;top:6px;left:8px;width:6px;height:8px;background:#ffe166}.avatar{width:48px;height:52px;background:#fff;border:4px solid #8664be;border-radius:22px 22px 10px 10px;box-shadow:0 8px 0 -2px #7355b342;position:relative}.avatar:before{content:'▪ ▪';position:absolute;top:4px;left:8px;font-size:24px;color:#674298}.avatar:after{content:'';position:absolute;width:16px;height:6px;background:#b5e6d6;left:12px;bottom:7px}.tag{background:#7352b8;color:white;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600;white-space:nowrap}.maplibregl-ctrl-attrib{font-size:10px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px;padding:12px;top:10px;left:10px;right:10px}header span{font-size:11px}nav{width:100%;margin:0}button{padding:8px 10px}.maplibregl-ctrl-top-right{top:124px}.note{max-width:275px;font-size:12px}}
</style></head><body>
<div id="map" aria-label="Skutečná mapa centra Plzně"></div>
<header><strong>QUESTLAYER</strong><span>Plzeň · studie skutečného podkladu</span><nav><button data-mode="base" aria-pressed="false">Podklad</button><button data-mode="game" aria-pressed="true">Herní styl</button><button data-mode="pixel" aria-pressed="false">Pixel textura</button><button id="globe">Globus</button></nav></header>
<div class="note"><b id="caption">Skutečné ulice, vlastní herní styl</b><span id="detail">Mapová data OSM. Herní značky jsou ukázkové.</span><div class="status" id="status">Načítání mapy…</div></div>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
const sourceURL='https://tiles.openfreemap.org/styles/positron';
const map=new maplibregl.Map({container:'map',style:sourceURL,center:[13.3767,49.7477],zoom:16.2,pitch:42,bearing:-12,antialias:true,attributionControl:false});
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.addControl(new maplibregl.AttributionControl({compact:false}),'bottom-right');
let original,mode='game',world=false;const markers=[];
function pattern(){const size=16,data=new Uint8Array(size*size*4);for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4;const alt=(x===3&&y===5)||(x===10&&y===11)||(x===11&&y===11);data[i]=alt?146:183;data[i+1]=alt?191:221;data[i+2]=alt?151:177;data[i+3]=255}return {width:size,height:size,data}}
function scaleWidth(w){if(typeof w==='number')return w*1.3;if(Array.isArray(w)&&(w[0]==='interpolate'||w[0]==='interpolate-hcl'||w[0]==='interpolate-lab'))return w.map((v,i)=>i>=4&&i%2===0?['*',1.3,v]:v);if(Array.isArray(w)&&w[0]==='step')return w.map((v,i)=>i>=2&&i%2===0?['*',1.3,v]:v);return w;}
function buildStyle(kind){let s=JSON.parse(JSON.stringify(original));if(kind==='base')return s;for(const l of s.layers){let p=l.paint||(l.paint={});if(l.type==='background')p['background-color']='#e7eddf';if(l.type==='fill'){if(l['source-layer']==='water')p['fill-color']='#aadbdc';else if(l['source-layer']==='park'||l.id==='landcover_wood'){p['fill-color']='#b7ddb1';if(kind==='pixel')p['fill-pattern']='grass-pixels';}else if(l['source-layer']==='building'){p['fill-color']='#d8cedf';p['fill-outline-color']='#beb2cb';}else p['fill-color']='#e7eddf';}if(l.type==='line'&&l['source-layer']==='transportation'){if(l.id.includes('railway')){p['line-color']='#9a91a4';p['line-opacity']=.3}else{p['line-color']=l.id.includes('casing')?'#d6cbdc':l.id.includes('path')?'#ead5ac':'#fffbef';const w=p['line-width'];if(w!==undefined)p['line-width']=scaleWidth(w)}}if(l.type==='symbol'){if(l['source-layer']!=='transportation_name'&&l['source-layer']!=='water_name')l.layout={...l.layout,visibility:'none'};p['text-color']='#7b7085';p['text-halo-color']='#faf8f0';p['text-halo-width']=1.5;}}
const i=s.layers.findIndex(l=>l.type==='symbol');s.layers.splice(i,0,{id:'game-buildings-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:15,paint:{'fill-extrusion-color':'#d8cbe3','fill-extrusion-height':['min',18,['coalesce',['get','render_height'],8]],'fill-extrusion-base':0,'fill-extrusion-opacity':.85,'fill-extrusion-vertical-gradient':true}});return s;}
function addZone(){if(map.getSource('demo-zone'))return;const c=[13.3766,49.7477],r=105,coords=[];for(let i=0;i<=80;i++){let a=i/80*Math.PI*2;coords.push([c[0]+Math.cos(a)*r/(111320*Math.cos(c[1]*Math.PI/180)),c[1]+Math.sin(a)*r/111320])}map.addSource('demo-zone',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}}});map.addLayer({id:'zone-fill',type:'fill',source:'demo-zone',minzoom:13,paint:{'fill-color':'#9b78da','fill-opacity':.14}});map.addLayer({id:'zone-outline',type:'line',source:'demo-zone',minzoom:13,paint:{'line-color':'#9a70d5','line-width':2.5,'line-dasharray':[3,2]}});}
function putMarker(cls,text,lnglat){const e=document.createElement('div');e.className=cls;e.textContent=text;markers.push(new maplibregl.Marker({element:e}).setLngLat(lnglat).addTo(map))}
map.on('styleimagemissing',e=>{if(e.id==='grass-pixels'&&!map.hasImage(e.id))map.addImage(e.id,pattern())});
map.on('style.load',()=>{if(mode==='pixel'&&!map.hasImage('grass-pixels'))map.addImage('grass-pixels',pattern());map.setProjection({type:'globe'});addZone();document.getElementById('status').textContent='Mapa načtena · nejde o spuštěnou hru';});
map.once('load',async()=>{original=await (await fetch(sourceURL)).json();map.setStyle(buildStyle(mode),{diff:false});putMarker('avatar','',[13.3766,49.7472]);putMarker('coin','',[13.3779,49.747]);putMarker('chest','',[13.3772,49.7469]);putMarker('tag','Otevřeno 24 min',[13.3766,49.74865]);});
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{if(!original)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));map.setStyle(buildStyle(mode),{diff:false});document.getElementById('caption').textContent={base:'Běžný mapový podklad',game:'Skutečné ulice, vlastní herní styl',pixel:'Stejná geometrie, pixelová textura'}[mode];document.getElementById('detail').textContent=mode==='pixel'?'Pixelová tráva a jednoduché 3D budovy. Geometrie ulic zůstává skutečná.':'Mapová data OSM. Herní značky jsou ukázkové.';};
document.getElementById('globe').onclick=()=>{world=!world;map.flyTo(world?{center:[13.38,49.75],zoom:1.8,pitch:0,bearing:0,duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:2400}:{center:[13.3767,49.7477],zoom:16.2,pitch:42,bearing:-12,duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:2400});document.getElementById('globe').textContent=world?'Zpět do Plzně':'Globus';};
map.on('zoom',()=>{for(const marker of markers)marker.getElement().style.display=map.getZoom()<13?'none':'';});
map.on('error',e=>{document.getElementById('status').textContent='Některá mapová data se nepodařilo načíst.';console.warn(e.error)});
</script></body></html>
