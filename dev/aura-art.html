<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QuestLayer Aura sprites</title>
    <style>
      body { margin: 0; overflow: auto; background: #f2ebff; }
      #root { min-height: 100dvh; }
      .aura-kit { max-width: 1040px; margin: 0 auto; padding: 32px 16px; color: #1a0335; }
      .aura-kit h1 { font-size: 32px; line-height: 1.2; margin: 8px 0 16px; }
      .aura-kit h2 { font-size: 20px; line-height: 1.3; margin: 32px 0 8px; }
      .aura-kit p { font-size: 16px; line-height: 1.5; color: #665577; margin: 8px 0; }
      .aura-kit .kit-eyebrow { font-size: 14px; color: #672eeb; }
      .aura-sheet { border-radius: 20px; padding: 16px; margin: 12px 0; }
      .aura-sheet.light { background: #fcfaff; border: 1px solid #dcd1eb; }
      .aura-sheet.dark { background: #1a0335; color: #ffe8ff; }
      .aura-sheet.dark p, .aura-sheet.dark small { color: #d9c8f3; }
      .aura-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 8px 0; }
      .aura-row > b { width: 128px; font-size: 14px; }
      .aura-cell { display: grid; gap: 4px; justify-items: center; }
      .aura-cell small { font-size: 12px; }
      .aura-composed { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
      .aura-composed > figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
      .aura-composed figcaption { font-size: 14px; }
      .aura-static .aura-sprite, .aura-static .aura-frame { animation: none !important; }
      .marker-stage { position: relative; height: 150px; min-width: 120px; display: grid; place-items: center; }
      .marker-stage .player-marker, .marker-stage .other-player-marker { position: relative; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/aura-art.tsx"></script>
  </body>
</html>
