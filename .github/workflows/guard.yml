name: Protected paths
# Lists the protected paths a pull request touches (contracts, deploy/signing
# scripts, money server code, sign-in/signing code, economy numbers, deployment
# records, CI, dependencies) for the reviewer, and fails only when the pull
# request commits a secret or state file or adds a line that looks like a
# secret. No label is needed (owner's decision, 9 Nov 2026).
# Rules: .github/scripts/protected-paths.mjs.
#
# Runs on `pull_request` (GitHub's event policy for this repository blocks
# `pull_request_target`). The token is read-only and the job name stays
# `protected-paths`, the check the branch ruleset requires.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the guard
        run: node .github/scripts/protected-paths.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
