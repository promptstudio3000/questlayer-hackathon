name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  first-session:
    # Phone journey: name, nearest find, first coin, first chest, Aura,
    # secure/share, feedback settings, equip, a practice market order filled
    # by a second explorer, and the creator feed, with axe a11y scans and a
    # first-load performance budget. One job per device profile.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-390
            browser: chromium
          - device: iphone
            browser: webkit
          - device: pixel
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run e2e:first-session -- --device=${{ matrix.device }}
        env:
          E2E_SHOTS: ${{ runner.temp }}/first-session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-session-${{ matrix.device }}
          path: ${{ runner.temp }}/first-session
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # The vault factory embeds the compiled vault WASM, so the vault must be
      # built before the workspace; the script owns that order.
      - run: bash scripts/build-contracts.sh --test
